name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECS_SERVICE: sumeetai-service
  ECS_CLUSTER: sumeetai-cluster

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push gateway image to Amazon ECR
      id: build-gateway
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./gateway/Dockerfile -t $ECR_REGISTRY/gateway:$IMAGE_TAG .
        docker push $ECR_REGISTRY/gateway:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/gateway:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push auth image to Amazon ECR
      id: build-auth
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/auth/Dockerfile -t $ECR_REGISTRY/auth-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/auth-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/auth-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push agent image to Amazon ECR
      id: build-agent
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/agent/Dockerfile -t $ECR_REGISTRY/agent-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/agent-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/agent-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Download and patch task definition
      run: |
        aws ecs describe-task-definition --task-definition sumeetai-task --query taskDefinition > task-def.json
        jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > clean-task-def.json
        
        cat << 'EOF' > patch.js
        const fs = require('fs');
        const def = JSON.parse(fs.readFileSync('clean-task-def.json'));
        
        const redisUrl = { name: "REDIS_URL", value: "redis://default:5oEqyh8TDuUCpBC6BfzZXsGTNUgLwiOL@sea-fog-meadow-85620.db.redis.io:18023" };
        const authService = { name: "AUTH_SERVICE", value: "http://localhost:8001" };
        const chatService = { name: "CHAT_SERVICE", value: "http://localhost:8002" };
        const agentService = { name: "AGENT_SERVICE", value: "http://localhost:8003" };
        const billingService = { name: "BILLING_SERVICE", value: "http://localhost:8004" };
        const mongoUri = { name: "MONGODB_URI", value: "mongodb+srv://goswamisumeet2004_db_user:42ZYUAZEgeRlFqPM@cluster0.gcfbqwx.mongodb.net/?appName=Cluster0" };
        const gatewayPort = { name: "PORT", value: "8000" };
        
        def.containerDefinitions.forEach(c => {
            if (!c.environment) c.environment = [];
            const envKeys = c.environment.map(e => e.name);
            
            // Redis for stateful services
            if ((c.name === 'gateway' || c.name === 'auth' || c.name === 'billing') && !envKeys.includes('REDIS_URL')) c.environment.push(redisUrl);
            
            // Gateway needs port + all internal service URLs
            if (c.name === 'gateway') {
                if (!envKeys.includes('PORT')) c.environment.push(gatewayPort);
                if (!envKeys.includes('AUTH_SERVICE')) c.environment.push(authService);
                if (!envKeys.includes('CHAT_SERVICE')) c.environment.push(chatService);
                if (!envKeys.includes('AGENT_SERVICE')) c.environment.push(agentService);
                if (!envKeys.includes('BILLING_SERVICE')) c.environment.push(billingService);
            }
            
            // Agent needs auth + chat + mongo
            if (c.name === 'agent') {
                if (!envKeys.includes('AUTH_SERVICE')) c.environment.push(authService);
                if (!envKeys.includes('CHAT_SERVICE')) c.environment.push(chatService);
                if (!envKeys.includes('MONGODB_URI')) c.environment.push(mongoUri);
            }
        });
        
        fs.writeFileSync('final-task-def.json', JSON.stringify(def, null, 2));
        EOF
        node patch.js

    - name: Fill in the new gateway image ID in the Amazon ECS task definition
      id: task-def-gateway
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: final-task-def.json
        container-name: gateway
        image: ${{ steps.build-gateway.outputs.image }}

    - name: Fill in the new auth image ID in the Amazon ECS task definition
      id: task-def-auth
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-gateway.outputs.task-definition }}
        container-name: auth
        image: ${{ steps.build-auth.outputs.image }}

    - name: Fill in the new agent image ID in the Amazon ECS task definition
      id: task-def-agent
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-auth.outputs.task-definition }}
        container-name: agent
        image: ${{ steps.build-agent.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-agent.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
