name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECS_SERVICE: sumeetai-service
  ECS_CLUSTER: sumeetai-cluster

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push gateway image to Amazon ECR
      id: build-gateway
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./gateway/Dockerfile -t $ECR_REGISTRY/gateway:$IMAGE_TAG .
        docker push $ECR_REGISTRY/gateway:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/gateway:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push auth image to Amazon ECR
      id: build-auth
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/auth/Dockerfile -t $ECR_REGISTRY/auth-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/auth-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/auth-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push agent image to Amazon ECR
      id: build-agent
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/agent/Dockerfile -t $ECR_REGISTRY/agent-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/agent-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/agent-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push chat image to Amazon ECR
      id: build-chat
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/chat/Dockerfile -t $ECR_REGISTRY/chat-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/chat-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/chat-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push billing image to Amazon ECR
      id: build-billing
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/billing/Dockerfile -t $ECR_REGISTRY/billing-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/billing-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/billing-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Download and patch task definition
      run: |
        aws ecs describe-task-definition --task-definition sumeetai-task --query taskDefinition > task-def.json
        jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def.json > clean-task-def.json
        
        cat << 'EOF' > patch.js
        const fs = require('fs');
        const def = JSON.parse(fs.readFileSync('clean-task-def.json'));
        
        const redisUrl = { name: "REDIS_URL", value: "redis://default:5oEqyh8TDuUCpBC6BfzZXsGTNUgLwiOL@sea-fog-meadow-85620.db.redis.io:18023" };
        const authService = { name: "AUTH_SERVICE", value: "http://localhost:8001" };
        const chatService = { name: "CHAT_SERVICE", value: "http://localhost:8002" };
        const agentService = { name: "AGENT_SERVICE", value: "http://localhost:8003" };
        const billingService = { name: "BILLING_SERVICE", value: "http://localhost:8004" };
        const mongoUri = { name: "MONGODB_URI", value: "mongodb+srv://goswamisumeet2004_db_user:42ZYUAZEgeRlFqPM@cluster0.gcfbqwx.mongodb.net/?appName=Cluster0" };
        const gatewayPort = { name: "PORT", value: "8000" };
        const firebaseProjectId = { name: "FIREBASE_PROJECT_ID", value: "sumeetai" };
        const firebaseClientEmail = { name: "FIREBASE_CLIENT_EMAIL", value: "firebase-adminsdk-fbsvc@sumeetai.iam.gserviceaccount.com" };
        const firebasePrivateKey = { name: "FIREBASE_PRIVATE_KEY", value: "-----BEGIN PRIVATE KEY-----\\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC4TJQpo2rKU7sB\\nqlEsgPPPPwWlOnFMxE872WNI5OV/kpbNRqchOy1RcsPgJGN3NZ+21diwswZsUUtH\\nJupg33qlWCzjGxDuBRUQV3wANRdLMBcZoDwEPME/HAZsX1fCrQ0HhhCS7S2lgzNE\\n8s7LhBW5qe3MFlM8BuNEpAypnhddjLUxuulLqfcRV++NtyjvK6RsK/3ZWsHXr8Kk\\n2kq4CNntsorzIWpv2nbwdLd6O7nZimP4iLJB/ocJJpTp1q7XRqn+Jp+dwqaNX0pT\\nOFYHd5DvXHZ1ydd8djJTpsaEBC/ID2gr521/L3Hs2dcZSoLcxIpNq2s/DE0FAndZ\\n2el7nuWhAgMBAAECggEABpBmLMk67QnASOv2NAzD+kU9LAxNw6FgjdH1Xf/Wj3WS\\n8Mzf2CB3oc1xzeh34TOgDJLXYtw+eeJHmUk42vJMt8nBIAXbU5HrZROLmWWKrskv\\nwnA1QQShsJ/st+SJr3eqxZJEIfqH+BuZGm8gN8oMnMoxS7X+GQ7I/o1t/MbSX9ja\\n+urIF74kZ+AEK7j5XKc68pcfylbUkd1bfC/5LhPb5RrmnQXR/rmAlkdMYsm+E9Hj\\nIzP51e2ytRZEOhURB6/sUtKriqUeuyb8i0hG8oQng1TWfRNNy4DCU/gCTfbm1qAF\\nD8b5sy5YCQ/kr8neu+y0Pw1iLbncQ/YWwBXy0v/msQKBgQDzVUIR3RbjoKa8FBWO\\nX/CpjjaDXEOS6x62NnTCA4bdPDQ+/8zMgPoHzbL68Qfr3/3t51ovpymp+HpfnWxB\\nI90vbA2Zz4J0iGXb3djSVS+Zu3J+qoT3UMOCZsjUvoM2vQdzeN4dOVHQ+ycAeo0p\\nIzmar9MNxx9Sp5WKv5tnDvEOUQKBgQDB5J0yioJAiPIRe/WsZR5+p0BEzOEDpmPW\\nkcjoDeiR1yQNUj1+inMjGAx33RUHQIvGB7y9VQNrRHudlLaxztz1Jwy0v9TaCaqd\\nrZEB0uJiNIbSW07CtAfeIoB1V5139eZsTrw+GQubPNjOams6wCoKbKKeuey37AZS\\nSRrJQJX+UQKBgGnOi9EassY95+JmVU04WHxR01BhQRzUUeFnYnOudukiMZGnRxUx\\njAbyob3OKuSc3FyjOar44/v9iLCk0hqtDpN9R5i3C4HCgZAOMiabVfxh7pI3cWPc\\n4XaFXRRs1r9piKDkUKiicPoPC1GA+HqHz5d8lqgqCmu1ZSgU0u0IKTdRAoGBAKoI\\nUdKApLjzX1T13/vOsW9gPHwZLzqEMAl6zzSw/cLnaDZGaKcPwuiDrmtu9YHmmKyR\\nHHLsmpL2+3C1eYF0Z1CVbg8UKxUKZRThoMh4pw54AcN3TxpvxnaGyyAcNXt9qRRR\\n98J9NDBuq7JYoLBk1HlPy0xmv7CKywBeG59hhCgBAoGBANj578d4ypTbqWK8Pvy/\\n36TzkzJ0dSyGubFfc5lx7sPwje4dsKAJ6E1PQUIOnK8/bE1AjTGXwzNbmcsHyZI3\\nJ9ZuwAyFIv0jgnnNhIC4klGppjtlo5N/P3oYAY9wIEU15mJIvGrp/EOAm42ImUMY\\n1CWw7/m5iwOEfJcCtbcfHYW0\\n-----END PRIVATE KEY-----\\n" };
        
        def.containerDefinitions.forEach(c => {
            if (!c.environment) c.environment = [];
            const envKeys = c.environment.map(e => e.name);
            
            // Redis for stateful services
            if ((c.name === 'gateway' || c.name === 'auth' || c.name === 'billing') && !envKeys.includes('REDIS_URL')) c.environment.push(redisUrl);
            
            // Gateway needs port + all internal service URLs
            if (c.name === 'gateway') {
                if (!envKeys.includes('PORT')) c.environment.push(gatewayPort);
                if (!envKeys.includes('AUTH_SERVICE')) c.environment.push(authService);
                if (!envKeys.includes('CHAT_SERVICE')) c.environment.push(chatService);
                if (!envKeys.includes('AGENT_SERVICE')) c.environment.push(agentService);
                if (!envKeys.includes('BILLING_SERVICE')) c.environment.push(billingService);
            }
            
            // Auth needs Firebase credentials
            if (c.name === 'auth') {
                if (!envKeys.includes('FIREBASE_PROJECT_ID')) c.environment.push(firebaseProjectId);
                if (!envKeys.includes('FIREBASE_CLIENT_EMAIL')) c.environment.push(firebaseClientEmail);
                if (!envKeys.includes('FIREBASE_PRIVATE_KEY')) c.environment.push(firebasePrivateKey);
            }
            
            // Agent needs auth + chat + mongo
            if (c.name === 'agent') {
                if (!envKeys.includes('AUTH_SERVICE')) c.environment.push(authService);
                if (!envKeys.includes('CHAT_SERVICE')) c.environment.push(chatService);
                if (!envKeys.includes('MONGODB_URI')) c.environment.push(mongoUri);
            }
        });
        
        fs.writeFileSync('final-task-def.json', JSON.stringify(def, null, 2));
        EOF
        node patch.js

    - name: Fill in the new gateway image ID in the Amazon ECS task definition
      id: task-def-gateway
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: final-task-def.json
        container-name: gateway
        image: ${{ steps.build-gateway.outputs.image }}

    - name: Fill in the new auth image ID in the Amazon ECS task definition
      id: task-def-auth
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-gateway.outputs.task-definition }}
        container-name: auth
        image: ${{ steps.build-auth.outputs.image }}

    - name: Fill in the new agent image ID in the Amazon ECS task definition
      id: task-def-agent
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-auth.outputs.task-definition }}
        container-name: agent
        image: ${{ steps.build-agent.outputs.image }}

    - name: Fill in the new chat image ID in the Amazon ECS task definition
      id: task-def-chat
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-agent.outputs.task-definition }}
        container-name: chat
        image: ${{ steps.build-chat.outputs.image }}

    - name: Fill in the new billing image ID in the Amazon ECS task definition
      id: task-def-billing
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-chat.outputs.task-definition }}
        container-name: billing
        image: ${{ steps.build-billing.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-billing.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
