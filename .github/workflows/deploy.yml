name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: gateway
  ECS_SERVICE: sumeetai-service
  ECS_CLUSTER: sumeetai-cluster
  ECS_TASK_DEFINITION: task-def-ap-south-1.json
  CONTAINER_NAME: gateway

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push gateway image to Amazon ECR
      id: build-gateway
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./gateway/Dockerfile -t $ECR_REGISTRY/gateway:$IMAGE_TAG .
        docker push $ECR_REGISTRY/gateway:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/gateway:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push agent image to Amazon ECR
      id: build-agent
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      working-directory: ./backend
      run: |
        docker build -f ./services/agent/Dockerfile -t $ECR_REGISTRY/agent-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/agent-service:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/agent-service:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new gateway image ID in the Amazon ECS task definition
      id: task-def-gateway
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: gateway
        image: ${{ steps.build-gateway.outputs.image }}

    - name: Fill in the new agent image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-gateway.outputs.task-definition }}
        container-name: agent
        image: ${{ steps.build-agent.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
