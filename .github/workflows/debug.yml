name: Debug ECS
on: workflow_dispatch
env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: sumeetai-cluster
  ECS_SERVICE: sumeetai-service
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: List ECR repos and task def containers
      run: |
        echo "=== ECR REPOS ===" && aws ecr describe-repositories --query "repositories[].repositoryName" --output text
        echo "=== TASK DEF CONTAINERS ===" && aws ecs describe-task-definition --task-definition sumeetai-task --query "taskDefinition.containerDefinitions[].{name:name,image:image}" --output table
        echo "=== GATEWAY ENV VARS ===" && aws ecs describe-task-definition --task-definition sumeetai-task --query "taskDefinition.containerDefinitions[?name=='gateway'].environment" --output json
