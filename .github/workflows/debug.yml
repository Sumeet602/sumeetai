name: Debug ECS
on: workflow_dispatch
env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: sumeetai-cluster
  ECS_SERVICE: sumeetai-service
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Check ECS service status and events
      run: |
        echo "=== SERVICE EVENTS ===" && aws ecs describe-services --cluster sumeetai-cluster --services sumeetai-service --query "services[0].events[:10]" --output table
        echo "=== RUNNING TASKS ===" && aws ecs list-tasks --cluster sumeetai-cluster --service-name sumeetai-service --desired-status RUNNING --output text
        echo "=== STOPPED TASKS ===" && aws ecs list-tasks --cluster sumeetai-cluster --service-name sumeetai-service --desired-status STOPPED --output text | head -5
