name: Debug ECS
on: workflow_dispatch
env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: sumeetai-cluster
  ECS_SERVICE: sumeetai-service
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Fetch Gateway Logs
      run: aws logs filter-log-events --log-group-name /ecs/sumeetai-task --log-stream-name-prefix gateway --limit 50 > logs.json && cat logs.json
